server.port=${PORT:8080}

# ---- Database (PostgreSQL by default; MySQL works too, see README) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/issue_tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=30

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-of-32+chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Files ----
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- CORS (comma separated) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
